# ─────────────────────────────────────────────────────────────────────────────
# Configuration Cloudflare Worker — Mathéquête API (PROD)
# Reconstruit le 13 mai 2026 après perte du fichier original.
# Source autoritative du database_id : `wrangler d1 list`.
# ─────────────────────────────────────────────────────────────────────────────

name = "mathequete-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# ─── Route domaine custom (désactivée pour l'instant) ───────────────────────
# Décommente quand mathequete.ca sera branché sur Cloudflare DNS.
#
# routes = [
#   { pattern = "mathequete.ca/api/*", zone_name = "mathequete.ca" }
# ]

# ─── D1 (SQLite serverless) ─────────────────────────────────────────────────
# UUID récupéré via `wrangler d1 list` le 13 mai 2026.

[[d1_databases]]
binding = "DB"
database_name = "mathequete-db"
database_id = "e3c52431-082b-463f-b6d3-bd777e76dc97"

# ─── R2 (stockage objets — PDFs forfaits école) ─────────────────────────────
# Bucket créé via `wrangler r2 bucket create mathequete-pdfs` le 15 mai 2026.
# Utilisé pour stocker les PDFs de codes QR générés après achat école
# (forfait_classe / forfait_petite_ecole). Liens signés 30 jours envoyés par
# email à l'admin. Voir D5/D8 dans plan_pont_prof_jeu.md.

[[r2_buckets]]
binding = "R2_PDFS"
bucket_name = "mathequete-pdfs"

# ─── Variables publiques (non-sensibles) ────────────────────────────────────

[vars]
ENVIRONMENT = "production"
STRIPE_API_VERSION = "2024-12-18.acacia"
# Resend : onboarding@resend.dev est le domaine partagé Resend, marche sans
# vérification DNS. À remplacer par licences@mathequete.ca quand le domaine
# sera vérifié sur resend.com → Domains.
RESEND_FROM_EMAIL = "onboarding@resend.dev"
RESEND_FROM_NAME = "Mathéquête"
PUBLIC_SITE_URL = "https://mathequete.pages.dev"

# ─── Secrets (poussés via `wrangler secret put`, JAMAIS dans ce fichier) ────
#   wrangler secret put HMAC_SECRET_KEY
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put RESEND_API_KEY

# ─── Observabilité ──────────────────────────────────────────────────────────

[observability]
enabled = true

